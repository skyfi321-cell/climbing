<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>妈妈我也要爬山</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Microsoft YaHei', sans-serif;
            touch-action: none; /* 关键：禁止浏览器默认手势 */
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas { display: block; }

        /* UI 层 */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* 顶部信息栏 */
        .hud {
            position: absolute;
            top: 40px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            color: #fff;
            text-shadow: 2px 2px 0 #3e2723;
        }
        #height-display {
            font-size: 32px;
            font-weight: 900;
            font-style: italic;
        }
        #location-tag {
            background: #5d4037;
            border: 2px solid #fff;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 0 #3e2723;
        }

        /* 游戏结束/开始 遮罩 */
        #menu-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
            transition: opacity 0.3s;
        }

        h1 {
            color: #ffca28;
            font-size: 32px;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 #d84315;
            transform: rotate(-3deg);
        }

        .info-box {
            background: #fff;
            color: #333;
            padding: 20px;
            border-radius: 10px;
            max-width: 80%;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.2);
        }

        .btn {
            background: #7cb342;
            border: none;
            padding: 15px 50px;
            color: white;
            font-size: 24px;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 6px 0 #558b2f;
            cursor: pointer;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #558b2f; }
        
        /* 道具图例 */
        .legend { display: flex; gap: 10px; justify-content: center; margin-top: 10px; font-size: 12px; }
        .legend span { display: flex; align-items: center; gap: 4px; }
        .dot { width: 10px; height: 10px; display: inline-block; border-radius: 50%; }

        #mute-btn {
            pointer-events: auto;
            background: rgba(0,0,0,0.5);
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            cursor: pointer;
            border: 2px solid #fff;
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <div class="hud">
        <div>
            <div id="height-display">0m</div>
            <div id="location-tag">🌲 山脚林地</div>
        </div>
        <div id="mute-btn">🔊</div>
    </div>
</div>

<div id="menu-screen">
    <h1>🏔️ 喵喵登山队</h1>
    
    <div class="info-box" id="start-content">
        <p style="font-weight:bold; font-size:18px;">目标：珠穆朗玛峰！</p>
        <p style="font-size:14px; color:#666; margin:10px 0;">
            按住屏幕 <b>左侧</b> 或 <b>右侧</b> 移动<br>
            躲避老妈，小心脚下！
        </p>
        <div class="legend">
            <span><i class="dot" style="background:#8d6e63"></i>岩石</span>
            <span><i class="dot" style="background:#a1887f; border:1px dashed #333"></i>碎石(会塌)</span>
            <span><i class="dot" style="background:#ff7043"></i>蘑菇(弹射)</span>
        </div>
    </div>

    <div class="info-box" id="end-content" style="display:none;">
        <h2 style="margin:0 0 10px 0; color:#d32f2f;">坠崖啦！</h2>
        <p id="final-score" style="font-size:24px; font-weight:bold;">0m</p>
        <p id="mom-quote" style="font-style:italic; color:#795548; margin-top:10px;">"..."</p>
    </div>

    <button class="btn" id="action-btn">开始登山</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    // --- 核心配置 ---
    const CONFIG = {
        gravity: 0.25,
        jumpStrength: -11.5, // 稍微跳高一点
        moveSpeed: 5.5,      // 移动更灵敏
        friction: 0.9,       // 摩擦力
    };

    // --- 音效系统 ---
    const AudioSys = {
        ctx: null,
        mute: false,
        init: function() {
            if(!this.ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AC();
            }
            if(this.ctx.state === 'suspended') this.ctx.resume();
        },
        play: function(type) {
            if(this.mute || !this.ctx) return;
            const t = this.ctx.currentTime;
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.connect(g); g.connect(this.ctx.destination);
            
            if(type === 'jump') { // 石头碰撞声
                o.type = 'square';
                o.frequency.setValueAtTime(150, t);
                o.frequency.exponentialRampToValueAtTime(600, t + 0.1);
                g.gain.setValueAtTime(0.1, t);
                g.gain.linearRampToValueAtTime(0, t + 0.1);
                o.start(t); o.stop(t+0.1);
            } else if(type === 'break') { // 碎石声
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(100, t);
                o.frequency.linearRampToValueAtTime(50, t + 0.2);
                g.gain.setValueAtTime(0.2, t);
                g.gain.linearRampToValueAtTime(0, t + 0.2);
                o.start(t); o.stop(t+0.2);
            } else if(type === 'spring') { // 弹簧蘑菇
                o.type = 'sine';
                o.frequency.setValueAtTime(300, t);
                o.frequency.exponentialRampToValueAtTime(900, t + 0.3);
                g.gain.setValueAtTime(0.2, t);
                g.gain.linearRampToValueAtTime(0, t + 0.3);
                o.start(t); o.stop(t+0.3);
            } else if(type === 'die') {
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(400, t);
                o.frequency.linearRampToValueAtTime(50, t + 0.6);
                g.gain.setValueAtTime(0.3, t);
                g.gain.linearRampToValueAtTime(0, t + 0.6);
                o.start(t); o.stop(t+0.6);
            }
        },
        toggle: function() {
            this.mute = !this.mute;
            document.getElementById('mute-btn').innerText = this.mute ? '🔇' : '🔊';
        }
    };

    // --- 游戏变量 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let isPlaying = false;
    let score = 0;
    
    // 玩家
    const player = { x:0, y:0, w:40, h:40, vx:0, vy:0, dir:1 };
    
    // 物体容器
    let platforms = [];
    let enemies = [];
    
    // 输入状态
    const input = { left: false, right: false };

    // 关卡/背景设置
    const biomes = [
        { h: 0, name: "🌲 山脚林地", color1: "#81d4fa", color2: "#b2dfdb", platColor: "#795548" }, 
        { h: 500, name: "⛰️ 陡峭岩壁", color1: "#90caf9", color2: "#e0e0e0", platColor: "#616161" },
        { h: 1500, name: "☁️ 云端栈道", color1: "#b39ddb", color2: "#ede7f6", platColor: "#5d4037" },
        { h: 3000, name: "❄️ 皑皑雪山", color1: "#cfd8dc", color2: "#ffffff", platColor: "#455a64" },
        { h: 5000, name: "🌌 珠峰之巅", color1: "#263238", color2: "#37474f", platColor: "#eceff1" }
    ];

    const momQuotes = [
        "没穿秋裤你也敢上山？！",
        "隔壁小虎都当山大王了！",
        "快下来！锅里炖了鱼！",
        "这就是你不回微信的理由？",
        "摔疼了别喊妈！"
    ];

    // --- 初始化 ---
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- 触控逻辑 (超级稳定版) ---
    // 直接监听整个窗口，防止canvas边缘失灵
    document.addEventListener('touchstart', (e) => {
        if(!isPlaying) return;
        // e.preventDefault(); // 暂时注释掉，保留部分浏览器行为，但在CSS里禁用了
        handleTouch(e.touches);
    }, {passive: false});

    document.addEventListener('touchmove', (e) => {
        if(!isPlaying) return;
        e.preventDefault(); // 禁止滑动页面
        handleTouch(e.touches);
    }, {passive: false});

    document.addEventListener('touchend', (e) => {
        if(!isPlaying) return;
        handleTouch(e.touches);
    });

    function handleTouch(touches) {
        input.left = false;
        input.right = false;
        for(let i=0; i<touches.length; i++) {
            if(touches[i].clientX < width/2) input.left = true;
            else input.right = true;
        }
    }

    // 按钮事件
    const actionBtn = document.getElementById('action-btn');
    actionBtn.addEventListener('click', () => {
        AudioSys.init();
        startGame();
    });
    document.getElementById('mute-btn').addEventListener('click', () => AudioSys.toggle());


    // --- 游戏主循环 ---
    function startGame() {
        document.getElementById('menu-screen').style.opacity = 0;
        setTimeout(() => document.getElementById('menu-screen').style.display = 'none', 300);
        
        isPlaying = true;
        score = 0;
        player.x = width/2 - 20;
        player.y = height - 200;
        player.vx = 0; 
        player.vy = -10;
        
        platforms = [];
        enemies = [];
        
        // 初始平台生成
        let y = height;
        while(y > 0) {
            y -= 80;
            platforms.push(generatePlatform(y));
        }
        
        requestAnimationFrame(loop);
    }

    function generatePlatform(y) {
        // 难度曲线
        let difficulty = Math.min(score / 5000, 1); // 0 到 1
        
        let type = 'normal';
        let isMoving = false;
        let pWidth = 80 - (difficulty * 30); // 随高度变窄
        pWidth = Math.max(45, pWidth);

        const rand = Math.random();

        // 1. 移动平台 (分数越高概率越大)
        if (score > 300 && rand < (0.1 + difficulty * 0.3)) {
            type = 'moving';
            isMoving = true;
        } 
        // 2. 碎石平台 (易碎)
        else if (score > 600 && rand < (0.2 + difficulty * 0.2)) {
            type = 'fragile';
        }
        // 3. 弹簧蘑菇 (奖励)
        else if (rand > 0.95) {
            type = 'spring';
            pWidth = 40; // 蘑菇比较小
        }

        return {
            x: Math.random() * (width - pWidth),
            y: y,
            w: pWidth,
            h: 18,
            type: type,
            vx: isMoving ? (Math.random() > 0.5 ? 2 + difficulty : -2 - difficulty) : 0,
            broken: false // 碎石状态
        };
    }

    function loop() {
        if (!isPlaying) return;

        // 1. 物理更新
        if (input.left) { player.vx -= 0.6; player.dir = -1; }
        else if (input.right) { player.vx += 0.6; player.dir = 1; }
        else { player.vx *= CONFIG.friction; }
        
        player.vx = Math.min(Math.max(player.vx, -CONFIG.moveSpeed), CONFIG.moveSpeed);
        player.x += player.vx;
        
        // 穿墙
        if(player.x < -player.w/2) player.x = width;
        if(player.x > width) player.x = -player.w/2;
        
        player.vy += CONFIG.gravity;
        player.y += player.vy;

        // 2. 镜头移动
        if (player.y < height * 0.45) {
            let diff = (height * 0.45) - player.y;
            player.y = height * 0.45;
            score += diff / 10;
            
            platforms.forEach(p => p.y += diff);
            enemies.forEach(e => e.y += diff);
            
            // 生成新平台
            let topP = platforms.reduce((min, p) => p.y < min ? p.y : min, height);
            if (topP > 80) {
                platforms.push(generatePlatform(topP - (Math.random() * 40 + 70)));
                
                // 生成老妈 (概率)
                if(score > 500 && Math.random() < 0.03) {
                    enemies.push({
                        x: Math.random() * (width - 50),
                        y: topP - 150,
                        w: 50, h: 50,
                        vx: Math.random() > 0.5 ? 2 : -2
                    });
                }
            }
        }

        // 3. 平台逻辑
        platforms.forEach(p => {
            if(p.type === 'moving') {
                p.x += p.vx;
                if(p.x <= 0 || p.x + p.w >= width) p.vx *= -1;
            }

            // 碰撞检测 (仅下落时)
            if(!p.broken && player.vy > 0 && 
               player.x + player.w*0.6 > p.x && 
               player.x + player.w*0.4 < p.x + p.w &&
               player.y + player.h > p.y && 
               player.y + player.h < p.y + p.h + 20) {
                
                if (p.type === 'spring') {
                    player.vy = CONFIG.jumpStrength * 1.4;
                    AudioSys.play('spring');
                    createParticles(p.x + p.w/2, p.y, '#f44336');
                } else if (p.type === 'fragile') {
                    player.vy = CONFIG.jumpStrength;
                    p.broken = true; // 标记为已踩碎
                    AudioSys.play('break');
                    createParticles(p.x + p.w/2, p.y, '#795548');
                } else {
                    player.vy = CONFIG.jumpStrength;
                    AudioSys.play('jump');
                }
            }
        });

        // 移除屏幕外和已碎裂的平台
        platforms = platforms.filter(p => p.y < height + 50 && !p.broken);

        // 4. 敌人碰撞
        enemies.forEach(e => {
            e.x += e.vx;
            if(e.x < 0 || e.x > width-e.w) e.vx *= -1;
            let dist = Math.hypot((player.x+20)-(e.x+25), (player.y+20)-(e.y+25));
            if(dist < 30) gameOver('mom');
        });
        enemies = enemies.filter(e => e.y < height + 50);

        // 5. 死亡检测
        if(player.y > height) gameOver('fall');

        // 6. 渲染
        draw();
        
        // 更新UI
        document.getElementById('height-display').innerText = Math.floor(score) + "m";
        let biome = biomes[0];
        for(let b of biomes) { if(score >= b.h) biome = b; }
        document.getElementById('location-tag').innerText = biome.name;
        document.getElementById('location-tag').style.backgroundColor = biome.platColor;

        requestAnimationFrame(loop);
    }

    // --- 粒子系统 (简单的视觉反馈) ---
    let particles = [];
    function createParticles(x, y, color) {
        for(let i=0; i<5; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random()-0.5)*5,
                vy: (Math.random()-0.5)*5,
                life: 1.0, color: color
            });
        }
    }

    function gameOver(reason) {
        isPlaying = false;
        AudioSys.play('die');
        
        const menu = document.getElementById('menu-screen');
        menu.style.display = 'flex';
        // 强制重排以触发transition
        void menu.offsetWidth; 
        menu.style.opacity = 1;
        
        document.getElementById('start-content').style.display = 'none';
        document.getElementById('end-content').style.display = 'block';
        document.getElementById('final-score').innerText = Math.floor(score) + " 米";
        document.getElementById('action-btn').innerText = "不服！再来！";
        
        let quote = reason === 'mom' ? "老妈：抓到你了！穿秋裤！" : `老妈：${momQuotes[Math.floor(Math.random()*momQuotes.length)]}`;
        document.getElementById('mom-quote').innerText = quote;
    }

    // --- 绘图函数 ---
    function draw() {
        // 1. 动态背景
        let biome = biomes[0];
        for(let i=biomes.length-1; i>=0; i--) { if(score >= biomes[i].h) { biome = biomes[i]; break; } }
        
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, biome.color1);
        grad.addColorStop(1, biome.color2);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // 2. 绘制平台
        platforms.forEach(p => {
            // 岩石质感
            ctx.fillStyle = biome.platColor;
            
            if (p.type === 'moving') {
                ctx.fillStyle = '#8d6e63'; // 木板色
                ctx.fillRect(p.x, p.y, p.w, p.h);
                // 纹理
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(p.x + 5, p.y, 5, p.h);
                ctx.fillRect(p.x + p.w - 10, p.y, 5, p.h);
            } 
            else if (p.type === 'fragile') {
                ctx.fillStyle = '#bdbdbd'; // 灰色碎石
                ctx.fillRect(p.x, p.y, p.w, p.h);
                // 裂纹
                ctx.beginPath();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.moveTo(p.x + 10, p.y);
                ctx.lineTo(p.x + p.w/2, p.y + p.h);
                ctx.lineTo(p.x + p.w - 10, p.y);
                ctx.stroke();
            } 
            else if (p.type === 'spring') {
                // 蘑菇
                ctx.fillStyle = '#fff'; // 杆
                ctx.fillRect(p.x + p.w/2 - 5, p.y + 5, 10, 10);
                ctx.fillStyle = '#ff5252'; // 伞盖
                ctx.beginPath();
                ctx.arc(p.x + p.w/2, p.y + 5, 15, Math.PI, 0);
                ctx.fill();
            } 
            else {
                // 普通岩石
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.w, p.h, 4);
                ctx.fill();
                // 顶部积雪/草地
                ctx.fillStyle = (score > 3000) ? '#fff' : '#66bb6a';
                if(score > 3000) ctx.globalAlpha = 0.8;
                ctx.fillRect(p.x, p.y, p.w, 4);
                ctx.globalAlpha = 1.0;
            }
        });

        // 3. 绘制老妈
        enemies.forEach(e => {
            drawMom(e.x, e.y, e.w);
        });

        // 4. 绘制玩家 (猫)
        drawCat(player.x, player.y, player.w, player.h, player.dir);

        // 5. 绘制粒子
        particles.forEach((pt, i) => {
            pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.1;
            ctx.globalAlpha = Math.max(0, pt.life);
            ctx.fillStyle = pt.color;
            ctx.fillRect(pt.x, pt.y, 4, 4);
        });
        ctx.globalAlpha = 1.0;
        particles = particles.filter(p => p.life > 0);
    }

    function drawCat(x, y, w, h, dir) {
        ctx.save();
        ctx.translate(x + w/2, y + h/2);
        if (dir === -1) ctx.scale(-1, 1);

        // 身体
        ctx.fillStyle = '#ff9800'; // 橘色
        ctx.beginPath();
        ctx.ellipse(0, 5, 16, 14, 0, 0, Math.PI*2);
        ctx.fill();
        
        // 登山包
        ctx.fillStyle = '#1565c0';
        ctx.fillRect(-12, -2, 8, 14);

        // 头
        ctx.fillStyle = '#ff9800';
        ctx.beginPath();
        ctx.arc(0, -8, 14, 0, Math.PI*2);
        ctx.fill();

        // 眼睛
        ctx.fillStyle = '#3e2723';
        ctx.beginPath();
        ctx.arc(5, -8, 2, 0, Math.PI*2); // 右眼
        ctx.arc(-2, -8, 2, 0, Math.PI*2); // 左眼(因为侧身)
        ctx.fill();

        // 耳朵
        ctx.fillStyle = '#ff9800';
        ctx.beginPath(); ctx.moveTo(-5, -20); ctx.lineTo(-10, -14); ctx.lineTo(0, -14); ctx.fill();
        ctx.beginPath(); ctx.moveTo(5, -20); ctx.lineTo(10, -14); ctx.lineTo(0, -14); ctx.fill();

        // 头带/登山镜
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-10, -12); ctx.lineTo(10, -12); ctx.stroke();

        ctx.restore();
    }

    function drawMom(x, y, size) {
        ctx.save();
        ctx.translate(x + size/2, y + size/2);
        
        // 头发
        ctx.fillStyle = '#3e2723';
        ctx.beginPath(); ctx.arc(0, 0, size/1.8, 0, Math.PI*2); ctx.fill();
        
        // 脸
        ctx.fillStyle = '#ffccbc';
        ctx.beginPath(); ctx.arc(0, 3, size/2.5, 0, Math.PI*2); ctx.fill();

        // 愤怒眉毛
        ctx.strokeStyle = '#d50000';
        ctx.lineWidth = 3;
        ctx.beginPath(); 
        ctx.moveTo(-8, -4); ctx.lineTo(-2, 0); 
        ctx.moveTo(8, -4); ctx.lineTo(2, 0); 
        ctx.stroke();

        // 嘴
        ctx.fillStyle = '#d50000';
        ctx.beginPath(); ctx.arc(0, 8, 4, 0, Math.PI*2); ctx.fill();
        
        ctx.restore();
    }

</script>
</body>
</html>
